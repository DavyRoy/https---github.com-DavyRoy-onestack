services:
  # ─────────────── Next.js (приложение сайта) ───────────────
  app-prod:
    container_name: onestack_app_prod
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    expose:
      - "3000"
    networks: [web, gen_dev]
    restart: unless-stopped
    # Приложение в покое держит ~140 МБ; запас — на пики SSR и прогрев кеша.
    # Лимит намеренно оставлен умеренным: он ограничивает ущерб, если внутри
    # контейнера снова начнёт плодиться что-то постороннее (см. инцидент 19.08.2026,
    # когда процессы под чужими именами съедали ~800 МБ и роняли next-server).
    mem_limit: 1536m
    memswap_limit: 1536m
    volumes:
      - next_image_cache:/app/.next/cache
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ────────────────────── MariaDB ───────────────────────────
  mariadb:
    image: mariadb:11.4
    container_name: onestack_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${SUITECRM_DB}
      MARIADB_USER: ${SUITECRM_DB_USER}
      MARIADB_PASSWORD: ${SUITECRM_DB_PASSWORD}
      MARIADB_EXTRA_FLAGS: "--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
    ports:
      # Только localhost: приложение, SuiteCRM и бэкапы ходят к базе по
      # внутренней сети Docker, наружу порт не нужен. Открытым он собирал
      # перебор пароля root с чужих адресов. Для доступа с ноутбука —
      # ssh -L 3307:127.0.0.1:3307 root@<сервер>
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks: [web]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ───────────────────── SuiteCRM 8 ─────────────────────────
  suitecrm:
    image: bitnamilegacy/suitecrm:8
    container_name: onestack_suitecrm
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MARIADB_HOST: mariadb
      MARIADB_PORT_NUMBER: "3306"
      SUITECRM_DATABASE_NAME: ${SUITECRM_DB}
      SUITECRM_DATABASE_USER: ${SUITECRM_DB_USER}
      SUITECRM_DATABASE_PASSWORD: ${SUITECRM_DB_PASSWORD}
      SUITECRM_USERNAME: ${SUITECRM_USERNAME}
      SUITECRM_PASSWORD: ${SUITECRM_PASSWORD}
      SUITECRM_EMAIL: ${SUITECRM_EMAIL}
      #SUITECRM_SMTP_HOST: ${SUITECRM_SMTP_HOST}
      #SUITECRM_SMTP_PORT: ${SUITECRM_SMTP_PORT}
      #SUITECRM_SMTP_USER: ${SUITECRM_SMTP_USER}
      #SUITECRM_SMTP_PASSWORD: ${SUITECRM_SMTP_PASSWORD}
      #SUITECRM_SMTP_PROTOCOL: ${SUITECRM_SMTP_PROTOCOL}
    volumes:
      - suitecrm_data:/bitnami
    expose:
      - "8080"
    networks: [web]
    restart: unless-stopped

  # ─────────────── Автобэкап БД (mysqldump + cron) ─────────
  db-backup:
    image: fradelg/mysql-cron-backup:latest
    container_name: onestack_db_backup
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MYSQL_HOST: mariadb
      MYSQL_PORT: 3306
      # Отдельная учётка только для чтения — бэкапу не нужны права на запись,
      # а root-пароль в этом контейнере не нужен тем более.
      MYSQL_USER: backup
      MYSQL_PASSWORD: ${BACKUP_DB_PASSWORD}
      # Обе рабочие базы. Раньше копировалась только CRM, а база сайта
      # с заявками не резервировалась вовсе. Перечисляем явно, чтобы в дамп
      # не попадали служебные схемы MariaDB.
      MYSQL_DATABASE: "onestack_app suitecrm"
      CRON_TIME: "0 2 * * *"
      # Без ограничения дампы копились бы бессрочно. Диск на этом сервере уже
      # переполнялся, и сайт из-за этого лежал.
      MAX_BACKUPS: "14"
      MYSQLDUMP_OPTS: "--single-transaction --quick --lock-tables=false --hex-blob"
      GZIP_LEVEL: "6"
      TZ: "Europe/Moscow"
    volumes:
      - db_backups:/backup
    networks: [web]
    restart: unless-stopped

  # ──────────────────────── Caddy (TLS/Proxy) ───────────────
  caddy:
    image: caddy:2-alpine
    container_name: onestack_caddy
    depends_on:
      app-prod:
        condition: service_healthy
      suitecrm:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    networks: [web]
    restart: unless-stopped

  # ───────────────── Telegram Bot (заявки) ──────────────────
  telegram-bot:
    container_name: onestack_telegram_bot
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      CRM_API_URL: ${CRM_API_URL}
    networks: [web, gen_dev]
    restart: unless-stopped

volumes:
  mariadb_data:
  suitecrm_data:
  db_backups:
  caddy_data:
  caddy_config:
  next_image_cache:

networks:
  web:
    driver: bridge
  gen_dev:
    external: true
